"c":9},{"z":"章程","p":"zhāng chéng","e":"articles of association","c":9},{"z":"董事会","p":"dǒng shì huì","e":"board of directors","c":9},{"z":"股东大会","p":"gǔ dōng dà huì","e":"shareholders' meeting","c":9}];
const CATS  = [{"zh":"银行与账户","en":"Banking & Accounts"},{"zh":"支付与结算","en":"Payments & Settlement"},{"zh":"存款与贷款","en":"Deposits & Loans"},{"zh":"利率与汇率","en":"Interest Rates & Foreign Exchange"},{"zh":"证券与投资","en":"Securities & Investment"},{"zh":"债券与基金","en":"Bonds & Funds"},{"zh":"保险与风险","en":"Insurance & Risk"},{"zh":"公司财务与报表","en":"Corporate Finance & Statements"},{"zh":"监管与合规","en":"Regulation & Compliance"},{"zh":"商务通用","en":"General Business"}];

const $ = s => document.querySelector(s);
const out = $('#out'), chips = $('#chips'), q = $('#q');
let curCat = -1, curMode = 'list', cardIdx = 0, view = TERMS.slice();

$('#total').textContent = TERMS.length;
$('#cats').textContent = CATS.length;

// 分类按钮
const all = document.createElement('button');
all.className = 'chip on'; all.textContent = '全部'; all.dataset.c = '-1';
chips.appendChild(all);
CATS.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.dataset.c = String(i);
  b.textContent = c.zh + ' ' + c.en;
  chips.appendChild(b);
});
chips.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  curCat = Number(b.dataset.c);
  chips.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
  apply();
});

q.addEventListener('input', apply);

document.querySelector('.modes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  curMode = b.dataset.m;
  document.querySelectorAll('.modes button').forEach(x => x.classList.toggle('on', x === b));
  apply();
});
$('#print').addEventListener('click', () => window.print());

function apply() {
  const k = q.value.trim().toLowerCase();
  view = TERMS.filter(t => {
    if (curCat >= 0 && t.c !== curCat) return false;
    if (!k) return true;
    return t.z.includes(k) || t.p.toLowerCase().includes(k) || t.e.toLowerCase().includes(k);
  });
  cardIdx = 0;
  $('#count').textContent = view.length + ' / ' + TERMS.length + ' 条';
  render();
}

function render() {
  if (curMode === 'list') renderList(); else renderCard();
}

function renderList() {
  if (!view.length) { out.innerHTML = '<div class="empty">没有匹配的条目</div>'; return; }
  let html = '<table><thead><tr><th style="width:26%">术语</th><th style="width:24%">拼音</th><th>英文</th><th style="width:18%">板块</th></tr></thead><tbody>';
  let last = -1;
  if (curCat < 0) {
    view.forEach(t => {
      if (t.c !== last) { last = t.c; html += '<tr class="grp"><td colspan="4">' + CATS[t.c].zh + ' ｜ ' + CATS[t.c].en + '</td></tr>'; }
      html += row(t);
    });
  } else {
    view.forEach(t => { html += row(t); });
  }
  html += '</tbody></table>';
  out.innerHTML = html;
}
function row(t) {
  return '<tr><td class="zh">' + t.z + '</td><td class="py">' + t.p + '</td><td class="en">' + t.e + '</td><td class="cat">' + CATS[t.c].zh + '</td></tr>';
}

function renderCard() {
  if (!view.length) { out.innerHTML = '<div class="empty">没有匹配的条目</div>'; return; }
  if (cardIdx >= view.length) cardIdx = 0;
  if (cardIdx < 0) cardIdx = view.length - 1;
  const t = view[cardIdx];
  out.innerHTML =
    '<div class="cardwrap">' +
      '<div class="card" id="card"><div class="inner">' +
        '<div class="face front"><div class="big">' + t.z + '</div><div class="hint">点击翻面 · 空格也可以</div></div>' +
        '<div class="face back"><div class="pybig">' + t.p + '</div><div class="enbig">' + t.e + '</div><div class="zhsm">' + CATS[t.c].zh + '</div><div class="hint">点击返回正面</div></div>' +
      '</div></div>' +
      '<div class="nav">' +
        '<button class="btn" id="prev">上一张</button>' +
        '<span class="idx">' + (cardIdx + 1) + ' / ' + view.length + '</span>' +
        '<button class="btn" id="next">下一张</button>' +
      '</div>' +
      '<div style="color:var(--ink3);font-size:12.5px">方向键 ← → 可翻页</div>' +
    '</div>';
  const card = $('#card');
  card.addEventListener('click', () => card.classList.toggle('flip'));
  $('#prev').addEventListener('click', () => { cardIdx--; renderCard(); });
  $('#next').addEventListener('click', () => { cardIdx++; renderCard(); });
}

document.addEventListener('keydown', e => {
  if (curMode !== 'card') return;
  if (e.key === 'ArrowLeft') { cardIdx--; renderCard(); }
  if (e.key === 'ArrowRight') { cardIdx++; renderCard(); }
  if (e.key === ' ') { const c = $('#card'); if (c) { c.classList.toggle('flip'); e.preventDefault(); } }
});

apply();
</script>
